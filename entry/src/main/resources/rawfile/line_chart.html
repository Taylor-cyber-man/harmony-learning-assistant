<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; }
html, body, #chart { width: 100%; height: 100%; }
body { background: transparent; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
var chart = echarts.init(document.getElementById('chart'));

function renderChart(data) {
  if (!data || data.length === 0) {
    chart.setOption({
      backgroundColor: 'transparent',
      graphic: {
        type: 'text', left: 'center', top: 'center',
        style: { text: '暂无学习数据', fontSize: 16, fill: '#94A3B8' }
      }
    });
    return;
  }
  var labels = data.map(function(d) { return d.dayLabel + '\n' + d.dayDate; });
  var values = data.map(function(d) { return d.minutes; });
  var dataMax = 0;
  for (var i = 0; i < values.length; i++) {
    if (values[i] > dataMax) dataMax = values[i];
  }
  var yMax = Math.max(120, Math.ceil(dataMax * 1.3 / 30) * 30);

  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 64, right: 16, top: 28, bottom: 44 },
    yAxis: {
      type: 'value', max: yMax, splitNumber: 4,
      axisLabel: { color: '#64748B', fontSize: 12, formatter: '{value}m' },
      splitLine: { lineStyle: { color: '#E2E8F0' } },
      axisLine: { show: false }, axisTick: { show: false }
    },
    xAxis: {
      type: 'category', data: labels,
      axisLabel: { color: '#475569', fontSize: 12, lineHeight: 16 },
      axisLine: { show: false }, axisTick: { show: false }
    },
    series: [{
      type: 'line', data: values, smooth: false,
      symbol: 'circle', symbolSize: 8,
      itemStyle: { color: '#3B82F6', borderWidth: 3, borderColor: '#fff' },
      lineStyle: { color: '#3B82F6', width: 3 },
      areaStyle: { color: '#EBF0FF' },
      label: {
        show: true,
        formatter: function(p) { return p.value > 0 ? p.value + 'm' : ''; },
        color: '#1E293B', fontWeight: 'bold', fontSize: 12, position: 'top'
      }
    }],
    tooltip: { trigger: 'axis', formatter: '{b}<br/>学习 {c} 分钟', confine: true }
  }, true);
}

window.addEventListener('resize', function() { chart.resize(); });
</script>
</body>
</html>
