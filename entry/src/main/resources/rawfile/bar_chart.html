<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; }
html, body, #chart { width: 100%; height: 100%; }
body { background: transparent; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
var chart = echarts.init(document.getElementById('chart'));

function renderChart(data) {
  if (!data || data.length === 0) {
    chart.setOption({
      backgroundColor: 'transparent',
      graphic: {
        type: 'text', left: 'center', top: 'center',
        style: { text: '暂无课程数据', fontSize: 16, fill: '#94A3B8' }
      }
    });
    return;
  }
  var categories = data.map(function(d) { return d.courseName; });
  var conceptData = data.map(function(d) { return d.conceptScore; });
  var criticalData = data.map(function(d) { return d.criticalScore; });
  var practiceData = data.map(function(d) { return d.practiceScore; });

  var dataMax = 0;
  for (var i = 0; i < conceptData.length; i++) {
    if (conceptData[i] > dataMax) dataMax = conceptData[i];
    if (criticalData[i] > dataMax) dataMax = criticalData[i];
    if (practiceData[i] > dataMax) dataMax = practiceData[i];
  }
  var yMax = Math.max(100, Math.ceil(dataMax * 1.25 / 10) * 10);
  // 单课程时柱子宽一些
  var barW = data.length === 1 ? 36 : 18;

  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 60, right: 16, top: 8, bottom: 44 },
    legend: {
      data: ['概念理解', '批判思维', '实践迁移'],
      bottom: 0, left: 'center',
      itemWidth: 14, itemHeight: 14, itemGap: 12,
      textStyle: { color: '#475569', fontSize: 11 }
    },
    yAxis: {
      type: 'value', max: yMax, splitNumber: 4,
      axisLabel: { color: '#64748B', fontSize: 12 },
      splitLine: { lineStyle: { color: '#E2E8F0' } },
      axisLine: { show: false }, axisTick: { show: false }
    },
    xAxis: {
      type: 'category', data: categories,
      axisLabel: { color: '#475569', fontSize: 12, interval: 0, rotate: 0 },
      axisLine: { show: false }, axisTick: { show: false }
    },
    series: [
      {
        name: '概念理解', type: 'bar', data: conceptData, barMaxWidth: barW,
        itemStyle: { color: '#3B82F6', borderRadius: [3, 3, 0, 0] },
        label: { show: true, position: 'top', color: '#1E293B', fontWeight: 'bold', fontSize: 11, formatter: function(p) { return p.value > 0 ? p.value : ''; } }
      },
      {
        name: '批判思维', type: 'bar', data: criticalData, barMaxWidth: barW,
        itemStyle: { color: '#7C3AED', borderRadius: [3, 3, 0, 0] },
        label: { show: true, position: 'top', color: '#1E293B', fontWeight: 'bold', fontSize: 11, formatter: function(p) { return p.value > 0 ? p.value : ''; } }
      },
      {
        name: '实践迁移', type: 'bar', data: practiceData, barMaxWidth: barW,
        itemStyle: { color: '#F97316', borderRadius: [3, 3, 0, 0] },
        label: { show: true, position: 'top', color: '#1E293B', fontWeight: 'bold', fontSize: 11, formatter: function(p) { return p.value > 0 ? p.value : ''; } }
      }
    ],
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, confine: true }
  }, true);
}

window.addEventListener('resize', function() { chart.resize(); });
</script>
</body>
</html>
