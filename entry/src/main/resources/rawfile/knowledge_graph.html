<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:transparent; font-family:-apple-system,'HarmonyOS Sans',sans-serif; }
#canvas { display:block; width:100%; height:100%; touch-action:none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(function() {
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var currentData = [];
var nodeMap = {};

var COLORS = ['#2563EB','#7C3AED','#0891B2','#059669','#D97706'];
var NODE_R = 36;
var LABEL_FONT = 16;
var VALUE_FONT = 'bold 18px';

var dpr = 1;
var nodes = [], edges = [];
var simRunning = false;
var simIter = 0;
var MAX_ITER = 400;

var tx = 0, ty = 0, scale = 1;
var dragNode = null;
var dragOffX = 0, dragOffY = 0;
var lastPanX = 0, lastPanY = 0;

// ============ 布局 ============
function initPositions(w, h) {
  if (nodes.length === 0) return;
  var cx = w / 2, cy = h / 2;
  if (nodes.length === 1) {
    nodes[0].x = cx; nodes[0].y = cy;
    return;
  }
  var spread = Math.min(w, h) * 0.38;
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].fixed) continue;
    var angle = (2 * Math.PI * i) / nodes.length - Math.PI / 2;
    nodes[i].x = cx + spread * Math.cos(angle);
    nodes[i].y = cy + spread * Math.sin(angle);
    nodes[i].vx = 0;
    nodes[i].vy = 0;
  }
}

function simStep() {
  if (nodes.length === 0) { simRunning = false; return; }
  var w = canvas.width / dpr;
  var h = canvas.height / dpr;
  var cx = w / 2, cy = h / 2;
  var progress = simIter / MAX_ITER;
  var alpha = 0.7 * (1 - progress);
  if (simIter >= MAX_ITER) { simRunning = false; return; }

  // 排斥力
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].fixed) continue;
    nodes[i].vx = 0; nodes[i].vy = 0;
    for (var j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      var dx = nodes[i].x - nodes[j].x;
      var dy = nodes[i].y - nodes[j].y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 2) { dist = 2; dx = 2; dy = 0; }
      var force = 1800 * alpha / (dist * dist);
      nodes[i].vx += (dx / dist) * force;
      nodes[i].vy += (dy / dist) * force;
    }
  }

  // 吸引力（边）
  for (var i = 0; i < edges.length; i++) {
    var s = edges[i].source, t = edges[i].target;
    var dx = t.x - s.x, dy = t.y - s.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 2) dist = 2;
    var idealLen = 180;
    var force = 0.004 * alpha * (dist - idealLen);
    if (!s.fixed) { s.vx += (dx / dist) * force; s.vy += (dy / dist) * force; }
    if (!t.fixed) { t.vx -= (dx / dist) * force; t.vy -= (dy / dist) * force; }
  }

  // 碰撞力
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].fixed) continue;
    for (var j = i + 1; j < nodes.length; j++) {
      if (nodes[j].fixed) continue;
      var dx = nodes[i].x - nodes[j].x;
      var dy = nodes[i].y - nodes[j].y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var minDist = NODE_R * 2 + 28;
      if (dist < minDist && dist > 0.1) {
        var overlap = minDist - dist;
        var force = 0.5 * alpha;
        nodes[i].vx += (dx / dist) * overlap * force;
        nodes[i].vy += (dy / dist) * overlap * force;
        nodes[j].vx -= (dx / dist) * overlap * force;
        nodes[j].vy -= (dy / dist) * overlap * force;
      }
    }
  }

  // 中心引力
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].fixed) continue;
    var dx = cx - nodes[i].x;
    var dy = cy - nodes[i].y;
    nodes[i].vx += dx * 0.0012 * alpha;
    nodes[i].vy += dy * 0.0012 * alpha;
  }

  // 阻尼
  var damp = 0.55;
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].fixed) continue;
    nodes[i].vx *= damp; nodes[i].vy *= damp;
  }

  // 边界约束
  var margin = NODE_R + LABEL_FONT + 4;
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i] === dragNode) continue;
    if (nodes[i].x < margin) nodes[i].x = margin;
    if (nodes[i].x > w - margin) nodes[i].x = w - margin;
    if (nodes[i].y < margin) nodes[i].y = margin;
    if (nodes[i].y > h - margin) nodes[i].y = h - margin;
  }

  // 应用速度
  var maxStep = 6;
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].fixed || nodes[i] === dragNode) continue;
    var mv = Math.sqrt(nodes[i].vx * nodes[i].vx + nodes[i].vy * nodes[i].vy);
    if (mv > maxStep) {
      nodes[i].vx = (nodes[i].vx / mv) * maxStep;
      nodes[i].vy = (nodes[i].vy / mv) * maxStep;
    }
    nodes[i].x += nodes[i].vx;
    nodes[i].y += nodes[i].vy;
  }
  simIter++;
}

// ============ 绘制 ============
function draw() {
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.translate(tx, ty);
  ctx.scale(scale, scale);

  // 边
  for (var i = 0; i < edges.length; i++) {
    var s = edges[i].source, t = edges[i].target;
    var dx = t.x - s.x, dy = t.y - s.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) dist = 1;
    var sr = NODE_R + 4, tr = NODE_R + 4;
    var sx = s.x + (dx / dist) * sr, sy = s.y + (dy / dist) * sr;
    var ex = t.x - (dx / dist) * tr, ey = t.y - (dy / dist) * tr;
    ctx.beginPath();
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 2.5;
    ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
    ctx.stroke();
    // 箭头
    var al = 10;
    var ax = ex - (dx / dist) * al, ay = ey - (dy / dist) * al;
    var px = -(dy / dist) * 5, py = (dx / dist) * 5;
    ctx.beginPath();
    ctx.fillStyle = '#94A3B8';
    ctx.moveTo(ex, ey);
    ctx.lineTo(ax + px, ay + py);
    ctx.lineTo(ax - px, ay - py);
    ctx.closePath(); ctx.fill();
    // 边标签
    // 边标签（精简，最多4字）
    if (edges[i].label) {
      var label = edges[i].label;
      if (label.length > 4) label = label.substring(0, 4);
      var mx = (sx + ex) / 2, my = (sy + ey) / 2 + 10;
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#94A3B8';
      ctx.textAlign = 'center';
      ctx.fillText(label, mx, my);
    }
  }

  // 节点
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    ctx.beginPath();
    ctx.arc(n.x, n.y, NODE_R + 10, 0, 2 * Math.PI);
    ctx.fillStyle = n.color + '1A'; ctx.fill();
    ctx.beginPath();
    ctx.arc(n.x, n.y, NODE_R, 0, 2 * Math.PI);
    ctx.fillStyle = n.color; ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath();
    ctx.arc(n.x - NODE_R * 0.2, n.y - NODE_R * 0.2, NODE_R * 0.4, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
    ctx.font = VALUE_FONT + ' sans-serif';
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.label, n.x, n.y);
  }

  // 名称标签（Pill 背景）
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var lines = wrapText(n.title, 6);
    var lineH = LABEL_FONT * 1.5;
    var maxLineW = 0;
    for (var k = 0; k < lines.length; k++) {
      var lw = ctx.measureText(lines[k]).width;
      if (lw > maxLineW) maxLineW = lw;
    }
    var pw = maxLineW + 16, ph = lines.length * lineH + 10;
    var px = n.x - pw / 2, py = n.y + NODE_R + 8;
    ctx.beginPath();
    roundRect(px, py, pw, ph, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fill();
    ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = 'bold ' + LABEL_FONT + 'px sans-serif';
    ctx.fillStyle = '#1E293B';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var textTop = py + ph / 2 - ((lines.length - 1) * lineH) / 2;
    for (var k = 0; k < lines.length; k++) {
      ctx.fillText(lines[k], n.x, textTop + k * lineH);
    }
  }
  ctx.restore();
}

function wrapText(text, max) {
  if (text.length <= max) return [text];
  var lines = []; var cur = '';
  for (var i = 0; i < text.length; i++) {
    cur += text[i];
    if (cur.length >= max) { lines.push(cur); cur = ''; }
  }
  if (cur.length > 0) lines.push(cur);
  return lines;
}

function roundRect(x, y, w, h, r) {
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, Math.PI * 1.5, 0);
  ctx.lineTo(x + w, y + h - r);
  ctx.arc(x + w - r, y + h - r, r, 0, Math.PI * 0.5);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + h - r, r, Math.PI * 0.5, Math.PI);
  ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  ctx.closePath();
}

// ============ 渲染循环 ============
var rafId = 0;
function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
function startLoop() { stopLoop(); simRunning = true; simIter = 0; loop(); }
function loop() {
  if (simRunning) simStep();
  draw();
  if (simRunning) rafId = requestAnimationFrame(loop);
  else rafId = 0;
}

// ============ 交互 ============
function screenToWorld(sx, sy) {
  return [(sx - tx) / scale, (sy - ty) / scale];
}

function hitNode(wx, wy) {
  for (var i = nodes.length - 1; i >= 0; i--) {
    var dx = wx - nodes[i].x, dy = wy - nodes[i].y;
    if (Math.sqrt(dx * dx + dy * dy) <= NODE_R + 6) return i;
  }
  return -1;
}

function getPos(e, idx) {
  var rect = canvas.getBoundingClientRect();
  var sx, sy;
  if (e.touches) {
    if (idx < e.touches.length) {
      sx = e.touches[idx].clientX - rect.left;
      sy = e.touches[idx].clientY - rect.top;
    } else if (idx < e.changedTouches.length) {
      sx = e.changedTouches[idx].clientX - rect.left;
      sy = e.changedTouches[idx].clientY - rect.top;
    } else return null;
  } else {
    sx = e.clientX - rect.left;
    sy = e.clientY - rect.top;
  }
  return [sx, sy];
}

function onPointerDown(sx, sy) {
  var wp = screenToWorld(sx, sy);
  var idx = hitNode(wp[0], wp[1]);
  if (idx >= 0) {
    dragNode = nodes[idx];
    dragOffX = wp[0] - dragNode.x;
    dragOffY = wp[1] - dragNode.y;
    simRunning = false; stopLoop();
    // 只选中高亮，不弹详情面板
    drawSelection(idx);
  } else {
    dragNode = null;
    lastPanX = sx; lastPanY = sy;
    drawSelection(-1);
  }
}

function onPointerMove(sx, sy) {
  if (dragNode) {
    var wp = screenToWorld(sx, sy);
    dragNode.x = wp[0] - dragOffX;
    dragNode.y = wp[1] - dragOffY;
    draw();
  } else if (dragNode === null) {
    tx += sx - lastPanX; ty += sy - lastPanY;
    lastPanX = sx; lastPanY = sy;
    draw();
  }
}

function onPointerUp() {
  if (dragNode) {
    dragNode.fixed = true;
    dragNode = null;
    startLoop();
  }
  // 松手后 1.5 秒清除选中高亮
  setTimeout(function() { drawSelection(-1); draw(); }, 1500);
}

// 节点选中高亮
var selectedIdx = -1;
function drawSelection(idx) {
  selectedIdx = idx;
  draw();
  if (idx >= 0) {
    // 在节点上画选中环
    var n = nodes[idx];
    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.translate(tx, ty);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.arc(n.x, n.y, NODE_R + 6, 0, 2 * Math.PI);
    ctx.strokeStyle = '#3B82F6';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }
}

// ---- pointer 事件 ----
canvas.addEventListener('pointerdown', function(e) {
  canvas.setPointerCapture(e.pointerId);
  var pos = getPos(e, 0); if (!pos) return;
  onPointerDown(pos[0], pos[1]);
  e.preventDefault(); e.stopPropagation();
});
canvas.addEventListener('pointermove', function(e) {
  if (!canvas.hasPointerCapture(e.pointerId)) return;
  var pos = getPos(e, 0); if (!pos) return;
  onPointerMove(pos[0], pos[1]);
  e.preventDefault(); e.stopPropagation();
});
canvas.addEventListener('pointerup', function(e) {
  canvas.releasePointerCapture(e.pointerId);
  onPointerUp();
  e.preventDefault(); e.stopPropagation();
});
canvas.addEventListener('pointercancel', function(e) {
  canvas.releasePointerCapture(e.pointerId);
  onPointerUp();
});
canvas.addEventListener('lostpointercapture', function(e) { onPointerUp(); });

// ---- touch 兜底 ----
canvas.addEventListener('touchstart', function(e) {
  if (e._handled) return; e._handled = true;
  var pos = getPos(e, 0); if (!pos) return;
  onPointerDown(pos[0], pos[1]);
  e.preventDefault(); e.stopPropagation();
}, { passive: false });
canvas.addEventListener('touchmove', function(e) {
  if (e._handled) return;
  var pos = getPos(e, 0); if (!pos) return;
  onPointerMove(pos[0], pos[1]);
  e.preventDefault(); e.stopPropagation();
}, { passive: false });
canvas.addEventListener('touchend', function(e) {
  onPointerUp(); e._handled = false;
  e.preventDefault(); e.stopPropagation();
});
canvas.addEventListener('touchcancel', function(e) {
  onPointerUp(); e._handled = false;
});

// ---- 滚轮缩放 ----
canvas.addEventListener('wheel', function(e) {
  var rect = canvas.getBoundingClientRect();
  var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  var factor = e.deltaY < 0 ? 1.12 : 0.89;
  var ns = Math.max(0.45, Math.min(2.8, scale * factor));
  tx = sx - (sx - tx) * (ns / scale);
  ty = sy - (sy - ty) * (ns / scale);
  scale = ns;
  draw(); e.preventDefault(); e.stopPropagation();
}, { passive: false });

// ---- 双击重置 ----
canvas.addEventListener('dblclick', function(e) {
  e.preventDefault(); e.stopPropagation();
  var rect = canvas.getBoundingClientRect();
  var pos = getPos(e, 0); if (!pos) return;
  var wp = screenToWorld(pos[0], pos[1]);
  if (hitNode(wp[0], wp[1]) < 0) {
    tx = 0; ty = 0; scale = 1;
    for (var i = 0; i < nodes.length; i++) nodes[i].fixed = false;
    initPositions(canvas.width / dpr, canvas.height / dpr);
    startLoop();
  }
});

// ============ 尺寸自适应 ============
function resize() {
  var rect = canvas.parentElement.getBoundingClientRect();
  var w = rect.width;
  if (w < 10) w = 360;
  dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = 400 * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = '400px';
  NODE_R = 36;
  LABEL_FONT = dpr > 2 ? 18 : 16;
  VALUE_FONT = 'bold ' + (dpr > 2 ? 19 : 18) + 'px';
  draw();
}
window.addEventListener('resize', function() { resize(); draw(); });

// ============ 对外 API ============
window.renderChart = function(data) {
  stopLoop();
  currentData = data || [];
  nodes = []; edges = []; nodeMap = {};

  if (currentData.length === 0) { resize(); draw(); return; }

  for (var i = 0; i < currentData.length; i++) {
    var d = currentData[i];
    var n = {
      id: '' + d.id, title: d.name, desc: d.description || '',
      children: d.children || [], edgeLabels: [],
      materialRef: d.materialRef || '', color: COLORS[i % COLORS.length],
      label: (i < 9 ? '0' : '') + (i + 1),
      x: 0, y: 0, vx: 0, vy: 0, fixed: false
    };
    nodes.push(n); nodeMap[n.id] = n;
  }

  for (var i = 0; i < currentData.length; i++) {
    var d = currentData[i];
    var src = nodeMap['' + d.id];
    if (!src) continue;
    if (d.relations && d.relations.length > 0) {
      for (var j = 0; j < d.relations.length; j++) {
        var tid = '' + d.relations[j];
        var tgt = nodeMap[tid];
        if (!tgt) continue;
        var lbl = (d.relationLabels && d.relationLabels[j]) ? d.relationLabels[j] : '';
        var dup = false;
        for (var k = 0; k < edges.length; k++) {
          if ((edges[k].source === src && edges[k].target === tgt) ||
              (edges[k].source === tgt && edges[k].target === src)) { dup = true; break; }
        }
        if (!dup) {
          edges.push({ source: src, target: tgt, label: lbl });
        }
      }
    }
  }

  resize();
  tx = 0; ty = 0; scale = 1;
  initPositions(canvas.width / dpr, canvas.height / dpr);
  startLoop();
};
})();
</script>
</body>
</html>
